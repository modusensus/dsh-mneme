# CodeRabbit 审阅配置：自动审兜底。
# Copilot 教育版额度不足，恢复 CodeRabbit 自动审阅兜底。
# Free 档限额仍小，保持 chill 档 + 锁文件/素材排除，控制额度消耗。
language: zh-CN

reviews:
  profile: chill
  auto_review:
    enabled: true
  # 锁文件与素材目录没有审阅价值，显式排除。
  path_filters:
    - "!**/package-lock.json"
    - "!images/**"
    - "!out/**"

chat:
  auto_reply: false
